<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Oxybaka Art</title>
    <meta
      name="description"
      content="Full illustration gallery for Oxybaka Art, with commission samples and portfolio pieces."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Paytone+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell page-shell-gallery">
      <header class="site-header">
        <a class="brand" href="index.html">Oxybaka</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="gallery.html" aria-current="page">Gallery</a>
          <a href="index.html#commissions">Commissions</a>
          <a href="index.html#about">About</a>
        </nav>
      </header>

      <main>
        <section class="section gallery-hero">
          <div class="section-heading">
            <p class="eyebrow">Full Gallery</p>
            <h1>Full gallery of work by Oxybaka.</h1>
            <p class="hero-text gallery-intro">
              A closer look at finished pieces, commission samples, and character-focused work.
            </p>
          </div>
          <div class="gallery-actions">
            <a class="button button-primary" href="index.html#commissions">Commission Info</a>
            <a class="button button-secondary" href="index.html">Back Home</a>
          </div>
        </section>

        <section class="section gallery-page-section">
          <div class="gallery-page-meta">
            <p class="eyebrow">Portfolio View</p>
            <p class="gallery-note">Browse by category or open any piece for a larger view.</p>
          </div>
          <div class="gallery-filters" id="gallery-filters" aria-label="Gallery categories"></div>
          <div class="gallery-grid gallery-grid-full" id="gallery-full" data-gallery-mode="full"></div>
        </section>
      </main>
    </div>

    <dialog class="lightbox" id="gallery-lightbox">
      <button class="lightbox-close" id="lightbox-close" aria-label="Close image view">Close</button>
      <figure class="lightbox-figure">
        <img id="lightbox-image" alt="" />
        <figcaption class="lightbox-caption">
          <h2 id="lightbox-title"></h2>
          <p id="lightbox-description"></p>
        </figcaption>
      </figure>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
